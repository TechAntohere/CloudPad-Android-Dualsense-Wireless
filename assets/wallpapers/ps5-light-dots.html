<!doctype html>
<!--
  PS5-style "light dots" live wallpaper — pure HTML + CSS, no JavaScript.

  Layers (back to front):
    1. deep-blue gradient + slowly breathing aurora glow
    2. rotating light-wave ribbons
    3. three parallax fields of drifting, twinkling light dots
    4. large soft bokeh orbs
    5. faint floating face-button shapes (triangle, circle, cross, square)
    6. vignette

  Use it as a web/HTML live wallpaper (e.g. Lively Wallpaper, Wallpaper Engine
  "web" type, KLWP/WebView launchers) or just open it in a browser fullscreen.
  Honors prefers-reduced-motion.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PS5 Light Dots</title>
<style>
:root {
  --bg-0: #000614;
  --bg-1: #001a4a;
  --bg-2: #00348a;
  --bg-3: #0a5bd1;
  --glow: 120, 180, 255;
  --speed: 1; /* raise to slow everything down, e.g. 1.5 */
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-0);
}

.wallpaper {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(120% 80% at 50% 115%, var(--bg-3) 0%, transparent 60%),
    linear-gradient(170deg, var(--bg-0) 0%, var(--bg-1) 40%, var(--bg-2) 80%, var(--bg-3) 120%);
  isolation: isolate;
}

/* ---------- 1. aurora ---------- */
.aurora {
  position: absolute;
  inset: -30%;
  background:
    radial-gradient(40% 35% at 30% 60%, rgba(var(--glow), .28), transparent 70%),
    radial-gradient(35% 30% at 75% 40%, rgba(70, 120, 255, .22), transparent 70%),
    radial-gradient(30% 25% at 55% 85%, rgba(150, 210, 255, .18), transparent 70%);
  filter: blur(40px);
  animation: aurora calc(36s * var(--speed)) ease-in-out infinite alternate;
}

@keyframes aurora {
  0%   { transform: translate3d(-4%, 2%, 0) rotate(0deg) scale(1); opacity: .8; }
  50%  { transform: translate3d(3%, -3%, 0) rotate(8deg) scale(1.08); opacity: 1; }
  100% { transform: translate3d(5%, 3%, 0) rotate(-6deg) scale(1.02); opacity: .85; }
}

/* ---------- 2. light waves ---------- */
.wave {
  position: absolute;
  left: 50%;
  top: 62%;
  width: 260vmax;
  height: 260vmax;
  margin-left: -130vmax;
  border-radius: 43% 47% 45% 46%;
  border-top: 1px solid rgba(190, 225, 255, .35);
  box-shadow:
    inset 0 2px 18px rgba(var(--glow), .25),
    0 -2px 30px rgba(var(--glow), .18);
  filter: blur(.6px);
  animation: wave calc(70s * var(--speed)) linear infinite;
}
.wave--2 {
  top: 66%;
  border-radius: 47% 42% 46% 44%;
  border-top-color: rgba(150, 200, 255, .22);
  animation-duration: calc(95s * var(--speed));
  animation-direction: reverse;
}
.wave--3 {
  top: 71%;
  border-radius: 45% 48% 43% 47%;
  border-top-color: rgba(220, 240, 255, .14);
  animation-duration: calc(120s * var(--speed));
}

@keyframes wave {
  to { transform: rotate(360deg); }
}

/* ---------- 3. light dots ---------- */
/*
  Each dot field is a single tiny element whose box-shadows are the dots.
  Every dot is drawn twice, one screen-height apart, so translating the
  field up by exactly 100vh loops seamlessly.
*/
.field {
  position: absolute;
  inset: 0;
  animation: sway calc(18s * var(--speed)) ease-in-out infinite alternate;
}
.field--mid  { animation-duration: calc(24s * var(--speed)); animation-delay: -6s; }
.field--near { animation-duration: calc(30s * var(--speed)); animation-delay: -12s; }

@keyframes sway {
  from { transform: translateX(-1.2vw); }
  to   { transform: translateX(1.2vw); }
}

.dots {
  position: absolute;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  border-radius: 50%;
  background: transparent;
  will-change: transform, opacity;
  animation:
    rise var(--rise) linear infinite,
    twinkle var(--blink) ease-in-out infinite alternate;
}
.dots--far-a, .dots--far-b   { --rise: calc(160s * var(--speed)); }
.dots--mid-a, .dots--mid-b   { --rise: calc(105s * var(--speed)); width: 2px; height: 2px; }
.dots--near-a, .dots--near-b { --rise: calc(70s * var(--speed));  width: 3px; height: 3px; }

.dots--far-a  { --blink: 4s; }
.dots--far-b  { --blink: 5.5s; animation-delay: -40s, -2s; }
.dots--mid-a  { --blink: 6s;   animation-delay: -10s, -1s; }
.dots--mid-b  { --blink: 7.5s; animation-delay: -55s, -3s; }
.dots--near-a { --blink: 5s;   animation-delay: -20s, -2.5s; }
.dots--near-b { --blink: 8s;   animation-delay: -45s, -4s; }

@keyframes rise {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(0, -100vh, 0); }
}

@keyframes twinkle {
  0%   { opacity: .35; }
  60%  { opacity: 1; }
  100% { opacity: .6; }
}

/* ---------- 4. bokeh orbs ---------- */
.orb {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%,
    rgba(230, 242, 255, .55) 0%,
    rgba(var(--glow), .25) 35%,
    rgba(var(--glow), 0) 70%);
  filter: blur(var(--b, 2px));
  mix-blend-mode: screen;
  opacity: 0;
  animation: orb calc(var(--d) * var(--speed)) ease-in-out var(--delay) infinite;
}

@keyframes orb {
  0%   { transform: translate3d(0, 6vh, 0) scale(.6); opacity: 0; }
  20%  { opacity: var(--o, .7); }
  50%  { transform: translate3d(2vw, -4vh, 0) scale(1); }
  80%  { opacity: var(--o, .7); }
  100% { transform: translate3d(-1vw, -14vh, 0) scale(.8); opacity: 0; }
}

/* ---------- 5. face-button shapes ---------- */
.shape {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--s);
  height: var(--s);
  opacity: 0;
  filter: drop-shadow(0 0 6px rgba(var(--glow), .8));
  animation: drift calc(var(--d) * var(--speed)) ease-in-out var(--delay) infinite;
}
.shape--circle {
  border: 2px solid rgba(220, 238, 255, .9);
  border-radius: 50%;
}
.shape--square {
  border: 2px solid rgba(220, 238, 255, .9);
  border-radius: 6%;
}
.shape--triangle {
  background: rgba(220, 238, 255, .9);
  /* outer triangle minus inner triangle = outline */
  clip-path: polygon(evenodd,
    50% 4%, 97% 90%, 3% 90%, 50% 4%,
    50% 17%, 13.5% 84%, 86.5% 84%, 50% 17%);
}
.shape--cross::before,
.shape--cross::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 6%;
  width: 2px;
  height: 88%;
  margin-left: -1px;
  background: rgba(220, 238, 255, .9);
  border-radius: 2px;
  transform: rotate(45deg);
}
.shape--cross::after { transform: rotate(-45deg); }

@keyframes drift {
  0%   { transform: translate3d(0, 8vh, 0) rotate(-12deg); opacity: 0; }
  25%  { opacity: .16; }
  50%  { transform: translate3d(1.5vw, 0, 0) rotate(6deg); opacity: .22; }
  75%  { opacity: .16; }
  100% { transform: translate3d(-1vw, -10vh, 0) rotate(18deg); opacity: 0; }
}

/* ---------- 6. vignette ---------- */
.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(130% 100% at 50% 45%, transparent 55%, rgba(0, 4, 16, .75) 100%),
    linear-gradient(to bottom, rgba(0, 4, 16, .45), transparent 25%);
}

/* ---------- accessibility ---------- */
@media (prefers-reduced-motion: reduce) {
  .wallpaper *, .wallpaper *::before, .wallpaper *::after {
    animation-play-state: paused !important;
  }
  .orb   { opacity: .5; }
  .shape { opacity: .15; }
}
</style>
