<!doctype html>
<!--
  PS5-style "light dots" live wallpaper — pure HTML + CSS, no JavaScript.
  Built phone-first (portrait), scales to any screen.

  Every particle is its own element with its own speed, drift, size and
  twinkle (set through inline CSS variables), so motion never looks
  "grouped". Three kinds, back to front:
    .bokeh  big out-of-focus discs
    .glow   soft medium sparkles
    .dot    small sharp light dots

  Tweak in :root — --speed (higher = slower), colours.
  Honors prefers-reduced-motion.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PS5 Light Dots</title>
<style>
:root {
  --top: #01030a;
  --mid: #03102e;
  --low: #07276a;
  --light: 150, 205, 255;
  --speed: 1;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--top);
}

.wallpaper {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(140% 55% at 50% 108%, rgba(30, 110, 255, .55), transparent 70%),
    linear-gradient(to bottom, var(--top) 0%, var(--mid) 45%, var(--low) 100%);
}

/* slow drifting light fog */
.fog {
  position: absolute;
  width: 140vmax;
  height: 140vmax;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--light), .16), transparent 60%);
  animation: fog calc(40s * var(--speed)) ease-in-out infinite alternate;
}
.fog--a { left: -70vmax; top: 10vh; }
.fog--b { right: -80vmax; top: 35vh; animation-duration: calc(55s * var(--speed)); animation-delay: -20s;
          background: radial-gradient(circle, rgba(60, 120, 255, .18), transparent 60%); }

@keyframes fog {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(18vw, -12vh, 0) scale(1.15); }
}

/* ---------- particles ---------- */
.wallpaper i {
  position: absolute;
  left: var(--x);
  top: 100%;
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  opacity: 0;
  will-change: translate, opacity;
  animation:
    rise calc(var(--t) * var(--speed)) linear var(--d) infinite,
    twinkle var(--tw) ease-in-out var(--td) infinite alternate;
}

@keyframes rise {
  from { translate: 0 0; }
  to   { translate: var(--dx) calc(-100vh - 140px); }
}

@keyframes twinkle {
  from { opacity: calc(var(--o) * .3); }
  to   { opacity: var(--o); }
}

.dot {
  background: radial-gradient(circle,
    #fff 0 28%,
    rgba(var(--light), .7) 45%,
    rgba(var(--light), 0) 72%);
  box-shadow: 0 0 8px 2px rgba(var(--light), .5);
}

.glow {
  background: radial-gradient(circle,
    rgba(240, 248, 255, .95) 0 10%,
    rgba(var(--light), .45) 32%,
    rgba(var(--light), 0) 70%);
}

.bokeh {
  background: radial-gradient(circle,
    rgba(200, 230, 255, .30) 0%,
    rgba(var(--light), .16) 40%,
    rgba(var(--light), 0) 70%);
  filter: blur(2px);
}

/* soft darkening at the edges so the dots "glow" in the middle */
.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0, 2, 10, .7) 100%);
}

@media (prefers-reduced-motion: reduce) {
  .wallpaper *, .wallpaper *::before, .wallpaper *::after {
    animation-play-state: paused !important;
  }
}
</style>
</head>
